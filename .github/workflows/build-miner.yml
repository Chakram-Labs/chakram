name: Build Chakram Miner

on:
  push:
    branches: [main]
    paths:
      - 'apps/miner/**'
      - 'cmd/chakram/**'
      - 'consensus/**'
      - 'lib/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v2.0.1). Leave empty to skip release.'
        required: false
        default: ''

permissions:
  contents: write

env:
  GETH_VERSION: v1.17.6
  GETH_COMMIT: 3d84c6b2e3e9be032f8f2dcd9e900f89391fcdab
  GO_VERSION: '1.26'

# ── macOS arm64 ──────────────────────────────────────────────────────────────
jobs:
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-go@0aaccfd150d50ccaeb0b1c59f4d4ab7826e8cf37
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/miner/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Build chakram (darwin/arm64)
        run: go build -o chakram_bin ./cmd/chakram/
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64

      - name: Build geth (darwin/arm64)
        run: |
          curl -fsSL -o /tmp/geth.tar.gz \
            "https://github.com/ethereum/go-ethereum/archive/refs/tags/${{ env.GETH_VERSION }}.tar.gz"
          tar -xzf /tmp/geth.tar.gz -C /tmp
          cd /tmp/go-ethereum-${GETH_VERSION#v}
          go build -o /tmp/geth_bin ./cmd/geth

      - name: Build Wails app
        working-directory: apps/miner
        run: ~/go/bin/wails build -platform darwin/arm64 -clean

      - name: Bundle binaries into .app
        run: |
          BUNDLE="apps/miner/build/bin/ChakramMiner.app/Contents/MacOS"
          cp chakram_bin  "$BUNDLE/chakram"
          cp /tmp/geth_bin "$BUNDLE/geth"
          chmod +x "$BUNDLE/chakram" "$BUNDLE/geth"
          codesign --force --deep --sign - "apps/miner/build/bin/ChakramMiner.app"

      - name: Create DMG
        working-directory: apps/miner/build/bin
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Chakram Miner" \
            --window-size 540 380 \
            --icon-size 80 \
            --icon "ChakramMiner.app" 130 190 \
            --app-drop-link 410 190 \
            "ChakramMiner-macOS-arm64.dmg" \
            "ChakramMiner.app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: miner-macos-arm64
          path: apps/miner/build/bin/ChakramMiner-macOS-arm64.dmg

# ── macOS x64 ────────────────────────────────────────────────────────────────
  build-macos-x64:
    name: macOS x64
