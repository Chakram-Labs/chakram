name: Build Chakram Miner

on:
  push:
    branches: [main]
    paths:
      - 'apps/miner/**'
      - 'cmd/chakram/**'
      - 'consensus/**'
      - 'engine/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v2.0.1). Leave empty for rolling pre-release.'
        required: false
        default: ''

permissions:
  contents: write

env:
  GETH_VERSION: v1.17.6
  GETH_COMMIT: 3d84c6b2e3e9be032f8f2dcd9e900f89391fcdab
  GO_VERSION: '1.26'
  WAILS_VERSION: v2.16.0

# ── macOS arm64 ──────────────────────────────────────────────────────────────
jobs:
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            apps/miner/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build chakram (darwin/arm64)
        run: go build -o chakram_bin ./cmd/chakram/
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64

      - name: Cache geth binary
        id: cache-geth
        uses: actions/cache@v4
        with:
          path: /tmp/geth_bin
          key: geth-darwin-arm64-${{ env.GETH_VERSION }}-${{ env.GETH_COMMIT }}

      - name: Build geth (darwin/arm64)
        if: steps.cache-geth.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/geth.tar.gz \
            "https://github.com/ethereum/go-ethereum/archive/refs/tags/${{ env.GETH_VERSION }}.tar.gz"
          tar -xzf /tmp/geth.tar.gz -C /tmp
          cd /tmp/go-ethereum-${GETH_VERSION#v}
          go build -o /tmp/geth_bin ./cmd/geth

      - name: Build Wails app (darwin/arm64)
        working-directory: apps/miner
        run: ~/go/bin/wails build -platform darwin/arm64 -clean

      - name: Bundle binaries into .app
        run: |
          BUNDLE="apps/miner/build/bin/ChakramMiner.app/Contents/MacOS"
          cp chakram_bin  "$BUNDLE/chakram"
          cp /tmp/geth_bin "$BUNDLE/geth"
          chmod +x "$BUNDLE/chakram" "$BUNDLE/geth"
          codesign --force --deep --sign - "apps/miner/build/bin/ChakramMiner.app"

      - name: Create DMG
        working-directory: apps/miner/build/bin
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Chakram Miner" \
            --window-size 540 380 \
            --icon-size 80 \
            --icon "ChakramMiner.app" 130 190 \
            --app-drop-link 410 190 \
            "ChakramMiner-macOS-arm64.dmg" \
            "ChakramMiner.app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: miner-macos-arm64
          path: apps/miner/build/bin/ChakramMiner-macOS-arm64.dmg

# ── Release ───────────────────────────────────────────────────────────────────
# Every push → rolling "miner-latest" pre-release (overwritten each time).
# workflow_dispatch with a version → proper named release (e.g. v2.0.1).
  release:
    name: Create Release
    needs: [build-macos-arm64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/download-artifact@fa0a91b85d4f404e444306234a1c3ca299ad2946
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Resolve tag and title
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "named=true" >> $GITHUB_OUTPUT
          else
            echo "tag=miner-latest" >> $GITHUB_OUTPUT
            echo "named=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing miner-latest
        if: steps.meta.outputs.named == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete miner-latest --yes --cleanup-tag || true

      - name: Create rolling pre-release (push)
        if: steps.meta.outputs.named == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create miner-latest \
            --title "Chakram Miner (latest build)" \
            --prerelease \
            --notes "## Chakram Miner — latest build

          Built from commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\`.
          Bundles geth ${{ env.GETH_VERSION }} and chakram. Self-contained — no separate installs needed.

          | Platform | Download |
          |---|---|
          | macOS Apple Silicon | ChakramMiner-macOS-arm64.dmg |" \
            artifacts/*

      - name: Create versioned release (workflow_dispatch)
        if: steps.meta.outputs.named == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.version }}" \
            --title "Chakram Miner ${{ github.event.inputs.version }}" \
            --notes "## Chakram Miner ${{ github.event.inputs.version }}

          Self-contained desktop mining app — no separate installs needed.
          Bundles geth ${{ env.GETH_VERSION }} and chakram.

          | Platform | Download |
          |---|---|
          | macOS Apple Silicon | ChakramMiner-macOS-arm64.dmg |" \
            artifacts/*
