name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Build faulty variant
        run: go build -tags faulty ./cmd/chakram/

      - name: Test
        run: go test -v -race ./...

      - name: Vet
        run: go vet ./...
